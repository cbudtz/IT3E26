# Bygger Docker-imaget paa GitHub (ikke paa CapRover-serveren, som loeb toer for RAM)
# og pusher det til GitHub Container Registry. CapRover traekker derefter kun imaget.
name: Build & push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/it3e26

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Valgfrit: bed CapRover om at redeploye, naar imaget er klar.
      # Opret secret CAPROVER_WEBHOOK_URL med app'ens webhook-URL (App > Deployment > "Method 3").
      - name: Trigger CapRover redeploy
        if: ${{ secrets.CAPROVER_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.CAPROVER_WEBHOOK_URL }}"
